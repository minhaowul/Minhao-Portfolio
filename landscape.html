    <meta
        name="robots"
        content="index, follow"

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"

    >

    <link

<body>

    <header class="landscape-navbar">

        <a href="index.html" class="landscape-logo">ML</a>

    <main class="landscape-page">

        <section class="landscape-title">

            <h1>LANDSCAPE</h1>

        </section>


        <div class="gallery-loading" id="landscapeLoading">
            Loading...
        </div>


        <section
            class="landscape-gallery"
            id="landscapeGallery"
        >

            <!-- Photos will be generated automatically -->

        </section>

    </main>


    <div class="lightbox" id="lightbox">

        <button
            class="lightbox-fullscreen"
            id="fullscreenButton"
            aria-label="Fullscreen"
        >
            ⛶
        </button>


        <button
            class="lightbox-close"
            id="lightboxClose"
            aria-label="Close"
        >
            ×
        </button>


        <button
            class="lightbox-arrow lightbox-prev"
            id="lightboxPrev"
        >
            ←
        </button>


        <div class="lightbox-content">

            <img
                id="lightboxImage"
                src=""
                alt=""
            >


            <div class="lightbox-info">

                <p id="lightboxLocation"></p>

            </div>

        </div>


        <button
            class="lightbox-arrow lightbox-next"
            id="lightboxNext"
        >
            →
        </button>

    </div>

        id="contact"
    >

                <p>
                    <a href="mailto:minhaoliu16@gmail.com">

                    </a>
                </p>

            <div class="social-links">

                <a

        </div>
