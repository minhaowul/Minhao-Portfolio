<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Automobile Photography — Minhao Liu">

    <title>Automobile - Minhao Liu Photography</title>

    <link rel="icon" type="image/png" href="logo.png">

    <meta
    name="description"
    content="Automobile photography by Minhao Liu, featuring cars and automotive scenes photographed in Beijing and beyond."
>

<meta
    name="author"
    content="Minhao Liu"
>

<meta
    name="robots"
    content="index, follow"
>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- ==================== NAVIGATION ==================== -->

    <header class="automobile-navbar">

        <a href="index.html" class="automobile-logo">ML</a>

        <nav class="automobile-nav-links">

            <a href="index.html">HOME</a>
            <a href="index.html#about">ABOUT ME</a>
            <a href="index.html#work">WORK</a>
            <a href="automobile.html#contact">CONTACT</a>

        </nav>

    </header>


    <!-- ==================== AUTOMOBILE ==================== -->

    <main class="automobile-page">

        <section class="automobile-title">

            <h1>AUTOMOBILE</h1>

        </section>


        <div class="gallery-loading" id="automobileLoading">
            Loading...
        </div>


        <section class="automobile-gallery" id="automobileGallery">

            <!-- Photos will be generated automatically -->

        </section>

    </main>


    <!-- ==================== LIGHTBOX ==================== -->

    <div class="lightbox" id="lightbox">

        <button
            class="lightbox-fullscreen"
            id="fullscreenButton"
            aria-label="Fullscreen"
        >
            ⛶
        </button>

        <button
            class="lightbox-close"
            id="lightboxClose"
            aria-label="Close"
        >
            ×
        </button>


        <button
            class="lightbox-arrow lightbox-prev"
            id="lightboxPrev"
        >
            ←
        </button>


        <div class="lightbox-content">

            <img
                id="lightboxImage"
                src=""
                alt=""
            >

            <div class="lightbox-info">

                <p id="lightboxDate"></p>

                <p id="lightboxLocation"></p>

            </div>

        </div>


        <button
            class="lightbox-arrow lightbox-next"
            id="lightboxNext"
        >
            →
        </button>

    </div>


    <!-- ==================== CONTACT ==================== -->

    <section class="contact-section" id="contact">

        <div class="contact-inner">

            <div class="contact-info">

                <h2>Minhao Liu Photography</h2>

                <p>Beijing, China</p>

                <p>WeChat: b1ank_wul_0710</p>

                <p>
                    <a href="mailto:minhaoliu16@gmail.com">
                        minhaoliu16@gmail.com
                    </a>
                </p>

            </div>


            <div class="social-links">

                <a
                    href="https://www.xiaohongshu.com/user/profile/42963577496"
                    target="_blank"
                    rel="noopener noreferrer"
                >

                    <img
                        src="https://cdn.simpleicons.org/xiaohongshu"
                        alt="Xiaohongshu"
                    >

                </a>


                <a
                    href="https://500px.com/p/minhaoliu16"
                    target="_blank"
                    rel="noopener noreferrer"
                >

                    <img
                        src="https://cdn.simpleicons.org/500px"
                        alt="500px"
                    >

                </a>


                <a
                    href="https://www.instagram.com/b1ank_wul/"
                    target="_blank"
                    rel="noopener noreferrer"
                >

                    <img
                        src="https://cdn.simpleicons.org/instagram"
                        alt="Instagram"
                    >

                </a>

            </div>

        </div>

    </section>


    <script src="automobile.js"></script>

</body>

</html>
