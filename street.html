<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Street Photography — Minhao Liu">

    <title>Street - Minhao Liu Photography</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>


<body class="street-page">


    <!-- =========================================
         NAVIGATION
    ========================================== -->

    <header class="street-navbar">

        <a href="index.html" class="street-logo">
            ML
        </a>

        <nav class="street-nav-links">

            <a href="index.html#about">
                ABOUT ME
            </a>

            <a href="index.html#work">
                WORK
            </a>

            <a href="index.html#contact">
                CONTACT
            </a>

        </nav>

    </header>


    <!-- =========================================
         MAIN
    ========================================== -->

    <main>

        <section class="street-title">

            <h1>STREET</h1>

        </section>


        <!-- LOADING -->

        <div class="gallery-loading" id="streetLoading">
            Loading...
        </div>


        <!-- GALLERY -->

        <section
            class="street-gallery"
            id="streetGallery">

            <!-- Photos will be generated automatically -->

        </section>

    </main>


    <!-- =========================================
         LIGHTBOX
    ========================================== -->

    <div class="lightbox" id="lightbox">

        <button
            class="lightbox-fullscreen"
            id="fullscreenButton"
            aria-label="Fullscreen">

            ⛶

        </button>


        <button
            class="lightbox-close"
            id="lightboxClose"
            aria-label="Close">

            ×

        </button>


        <button
            class="lightbox-arrow lightbox-prev"
            id="lightboxPrev">

            ←

        </button>


        <div class="lightbox-content">

            <img
                id="lightboxImage"
                src=""
                alt="">


            <div class="lightbox-info">

                <p id="lightboxDate"></p>

                <p id="lightboxLocation"></p>

            </div>

        </div>


        <button
            class="lightbox-arrow lightbox-next"
            id="lightboxNext">

            →

        </button>

    </div>


    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script src="street.js"></script>

</body>

</html>
