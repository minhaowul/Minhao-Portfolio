    ========================================== -->

        <section class="street-title">

                        </a>

                <div class="social-links">

                        href="https://www.instagram.com/b1ank_wul/"

    ========================================= -->

        <button
            class="lightbox-fullscreen"
            id="fullscreenButton"
            aria-label="Fullscreen">

            ⛶

        </button>


        <button
            class="lightbox-close"
            id="lightboxClose"
            aria-label="Close">

            ×

        </button>


        <button
            class="lightbox-arrow lightbox-prev"
            id="lightboxPrev">

            ←

        </button>

            <img
                id="lightboxImage"
                src=""

    <p id="lightboxLocation"></p>

</div>
