<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404 - Minhao Liu Photography</title>

    <link rel="icon" type="image/png" href="logo.png">

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        body {
            background: #ffffff;
            color: #111111;

            font-family:
                Inter,
                Helvetica Neue,
                Helvetica,
                Arial,
                sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            text-align: center;
        }

        .error {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .error-number {
            font-size: 96px;
            font-weight: 300;
            letter-spacing: -4px;
            line-height: 1;
            margin-bottom: 24px;
        }

        .error-text {
            font-size: 13px;
            font-weight: 400;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 32px;
        }

        .home-link {
            font-size: 11px;
            letter-spacing: 1.5px;
            text-transform: uppercase;

            color: #111111;
            text-decoration: none;

            border-bottom: 1px solid #111111;

            padding-bottom: 4px;

            transition: opacity 0.25s ease;
        }

        .home-link:hover {
            opacity: 0.5;
        }

        @media (max-width: 600px) {

            .error-number {
                font-size: 72px;
            }

            .error-text {
                font-size: 11px;
            }

        }

    </style>

</head>


<body>

    <main class="error">

        <div class="error-number">
            404
        </div>

        <div class="error-text">
            Page not found
        </div>

        <a
            href="index.html"
            class="home-link"
        >
            Return Home
        </a>

    </main>

</body>

</html>
